# ===========================
# PsicoFlow - Docker Compose
# ===========================
# Uso: docker compose up -d
# Parar: docker compose down
# Parar e limpar volumes: docker compose down -v

services:
  # ─── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: psicoflow-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: psicoflow
      POSTGRES_PASSWORD: SENHA_REMOVIDA
      POSTGRES_DB: psicoflow_db
    volumes:
      - psicoflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psicoflow -d psicoflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin (opcional, para visualização) ─────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: psicoflow-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@psicoflow.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  psicoflow_pgdata:
    driver: local
